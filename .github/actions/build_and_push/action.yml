name: Docker Build and Push
inputs:
  refspec:
    description: "Commit to check out"
    required: true
    type: string
  docker_tag:
    description: "Commit short SHA"
    required: true
    type: string
  ecr_repository_name:
    required: true
    type: string
  aws_region:
    required: true
    type: string
  aws_role_arn:
    description: "ARN of the IAM role to assume via GitHub OIDC for ECR push"
    required: true
    type: string
  dockerfile_name:
    required: false
    type: string
  build_dir:
    required: false
    type: string
runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.refspec }}
        fetch-depth: 0
    - name: Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.aws_role_arn }}
        aws-region: ${{ inputs.aws_region }}
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
    - name: Build, tag, and push image to ECR
      shell: bash
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      run: |
        DOCKERFILE="${{ inputs.dockerfile_name || 'Dockerfile' }}"
        BUILD_DIR="${{ inputs.build_dir || '.' }}"
        IMAGE_TAG="${ECR_REGISTRY}/${{ inputs.ecr_repository_name }}:${{ inputs.docker_tag }}"
        docker build -t "$IMAGE_TAG" -f "$BUILD_DIR/$DOCKERFILE" "$BUILD_DIR"
        docker push "$IMAGE_TAG"
