name: Docker Build and Push
inputs:
  refspec:
    description: "Commit to check out"
    required: true
    type: string
  docker_tag:
    description: "Commit short SHA"
    required: true
    type: string
  ecr_repository_name:
    required: true
    type: string
  aws_region:
    required: true
    type: string
  aws_role_arn:
    description: "ARN of the IAM role to assume via GitHub OIDC for ECR push"
    required: true
    type: string
  dockerfile_name:
    description: "Path to the Dockerfile, relative to repo root (e.g. ./api/Dockerfile)"
    required: false
    type: string
  build_dir:
    description: "Docker build context directory, relative to repo root (e.g. ./api/)"
    required: false
    type: string
runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.refspec }}
        fetch-depth: 0
    - name: Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.aws_role_arn }}
        aws-region: ${{ inputs.aws_region }}
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
    - name: Build, tag, and push image to ECR
      shell: bash
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ${{ inputs.ecr_repository_name }}
        IMAGE_TAG: ${{ inputs.docker_tag }}
      run: |
        DOCKERFILE="${{ inputs.dockerfile_name || 'Dockerfile' }}"
        BUILD_DIR="${{ inputs.build_dir || '.' }}"
        IMAGE_REF="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
        # `dockerfile_name` is a repo-root-relative path (matching v3 semantics);
        # `build_dir` is the docker context dir. Do not join them.
        # --provenance=false avoids OCI image index in ECR (see prior fix in v3).
        docker build --provenance=false -t "$IMAGE_REF" -f "$DOCKERFILE" "$BUILD_DIR"
        docker push "$IMAGE_REF"
